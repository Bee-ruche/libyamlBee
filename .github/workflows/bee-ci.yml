# Bee CI of the libyaml fork (https://github.com/Bee-ruche/libyamlBee). Independent fork, not affiliated with the libyaml
# project.
#
# Steps, in order (the first failed one is reported, see docs/evaluation.md in the Bee registry):
#   1. manifest and size: bee check-fork, with the registry's tool (branch main)
#   2. build and original tests of libyaml (cmake + ctest), x86-64 and ARM64
#   3. event stream determinism (bee/tests, oracle + fingerprints, emitter round trip), x86-64 and ARM64
#   4. differential fuzzing of the parser (base against PR), libFuzzer + ASan/UBSan, 10 minutes, x86-64
#   5. interleaved A/B bench: the PR's start point against the PR's head, 10 repetitions, Cachegrind
#   6. tests of the PR's CI tooling (bee/ci/test_verdict.py), if it modifies bee/ci/, bee/sandbox/ or this workflow
#   7. verdict.json, published as the artifact « verdict » (read by the registry's workflow verdicts.yml)
#
# Security: the same as miniz's CI. permissions contents: read, no secret, persist-credentials false, trigger
# pull_request. The judges (bee/) come from the PR's BASE; only libyaml's sources come from the PR, which cannot relax
# those files. CONTRIBUTION.yaml and the task are data (yaml.safe_load). « ci » is decided by the verdict job from
# needs.*.result.
# BUT this workflow file is the PR's (pull_request trigger): a PR that modifies .github/ or bee/ can forge its own
# verdict. The registry detects it on its side (the PR's list of files, read from GitHub's API, verdicts.yml): verdict
# refused for an optimization, review by the council or a Confirmed member required for a tooling task (R3).
name: bee-ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bee-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  TETE_SHA: ${{ github.event.pull_request.head.sha }}
  REGISTRE: Bee-ruche/registre
  ETATS: ${{ github.workspace }}/etats
  # The fork's original master, before any Bee tooling. master already has bee/, so the bootstrap is never triggered;
  # the variable stays for consistency with bee/ci/juges.sh.
  BEE_COMMIT_AMORCAGE: 90a56d4500aa1a1798514c5cb55c3ad4cb095f94
  # Identical copy of the logic of bee/ci/juges.sh, run by the « Judges » step of each job (bee/ci/test_verdict.py
  # checks that they are identical). It writes the state values the base's bee/ci/verdict.py reads (succes, echec, oui).
  BEE_JUGES: |
    mkdir -p "$etats"
    if [ -f "$base/bee/ci/etape.sh" ]; then
      echo "Judges: bee/ of the PR's base ($base_sha)."
      echo "succes" > "$etats/juges.txt"
    elif [ "$base_sha" = "$BEE_COMMIT_AMORCAGE" ] && [ -f "$pr/bee/ci/etape.sh" ]; then
      echo "::warning::BOOTSTRAP: the base $base_sha (pinned bootstrap commit) does not contain bee/; the judges come from the PR itself (verdict.json: bootstrap: true)."
      rm -rf "$base/bee"
      cp -a "$pr/bee" "$base/bee"
      mkdir -p "$base/.github/workflows"
      cp -a "$pr/.github/workflows/bee-ci.yml" "$base/.github/workflows/bee-ci.yml"
      echo "oui" > "$etats/amorcage.txt"
      echo "succes" > "$etats/juges.txt"
    else
      echo "echec" > "$etats/juges.txt"
      echo "::error::The PR's base ($base_sha) does not contain bee/: no judges, CI refused (only the bootstrap commit $BEE_COMMIT_AMORCAGE is accepted without judges)." >&2
      exit 1
    fi

jobs:
  manifeste:
    name: Manifest and size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tache: ${{ steps.manifeste.outputs.tache }}
      type: ${{ steps.manifeste.outputs.type }}
      metrique: ${{ steps.manifeste.outputs.metrique }}
    steps:
      - name: The PR's base (judges)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: The PR's head (full history, for the diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Bee registry (branch main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.REGISTRE }}
          ref: main
          path: registre
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The bee tool's dependencies (the registry's tools/requirements.txt)
        run: |
          if [ ! -f registre/tools/requirements.txt ]; then
            echo "::error::The registry has no tools/requirements.txt: the bee tool cannot be installed." >&2
            exit 1
          fi
          pip install -r registre/tools/requirements.txt
      - name: Manifest, task, R1 and commandment 3
        id: manifeste
        env:
          AUTEUR: ${{ github.event.pull_request.user.login }}
          BEE_SORTIE_TACHE: ${{ github.workspace }}/donnees/tache.yaml
        run: |
          mkdir -p donnees
          base/bee/ci/etape.sh "$ETATS" manifeste_et_taille base/bee/ci/manifeste.sh pr registre python3
      - name: Keep the manifest, the task and the state
        if: always()
        env:
          MANIFESTE: ${{ steps.manifeste.outputs.manifeste }}
        run: |
          mkdir -p donnees
          # Name checked by bee/ci/manifeste.sh (manifests/ or manifestes/libyaml-NNNN.yaml, or CONTRIBUTION.yaml);
          # a manifest is a regular file: a symbolic link is not copied.
          case "$MANIFESTE" in
            manifests/libyaml-[0-9][0-9][0-9][0-9].yaml|manifestes/libyaml-[0-9][0-9][0-9][0-9].yaml|CONTRIBUTION.yaml)
              if [ -f "pr/$MANIFESTE" ] && [ ! -L "pr/$MANIFESTE" ]; then cp "pr/$MANIFESTE" donnees/CONTRIBUTION.yaml 2>/dev/null || true; fi ;;
          esac
          cp -r "$ETATS" donnees/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-manifeste
          path: donnees/
          if-no-files-found: warn

  compilation-et-tests:
    name: Build and tests (${{ matrix.arch }})
    needs: manifeste
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            machine: ubuntu-24.04
          - arch: arm64
            machine: ubuntu-24.04-arm
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 30
    steps:
      - name: The PR's base (judges; full history for the corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: The PR's head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Tools (gcc, g++, cmake)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends build-essential cmake
      - name: Build and original tests of libyaml
        run: base/bee/ci/etape.sh "$ETATS" compilation_${{ matrix.arch }} base/bee/ci/tests_origine.sh pr "$RUNNER_TEMP/cmake"
      - name: Event stream determinism
        if: always()
        run: base/bee/ci/etape.sh "$ETATS" determinisme_${{ matrix.arch }} base/bee/ci/tests.sh pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-tests-${{ matrix.arch }}
          path: etats/
          if-no-files-found: warn

  fuzzing:
    name: Fuzzing, 10 minutes (x86-64)
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: The PR's base (harness; full history for the seed corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: The PR's head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Tools (clang 18 and its libFuzzer runtime)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends clang-18 libclang-rt-18-dev
      # Faulty inputs, logs and traces NEVER leave the CI machine (the registry's docs/security.md): lancer.sh runs in
      # discreet mode (fingerprints only) and replays each faulty input on the base; a discrepancy that already exists
      # there is reported without counting against the PR. The harness is the base's; only the PR that introduces it,
      # since its base has no harness, goes through its own.
      - name: Differential fuzzing of the parser, 600 s
        env:
          CLANG: clang-18
          BEE_FUZZ_SORTIES: ${{ runner.temp }}/sorties-fuzz
          BEE_FUZZ_DISCRET: "1"
        run: |
          harnais=base/bee/fuzz/lancer.sh
          if [ ! -f "$harnais" ]; then
            echo "::notice::The base has no fuzzing harness yet: the PR's is used."
            harnais=pr/bee/fuzz/lancer.sh
          fi
          base/bee/ci/etape.sh "$ETATS" fuzzing bash "$harnais" 600 --source pr --reference base
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-fuzzing
          path: etats/
          if-no-files-found: warn

  banc-ab:
    name: A/B bench
    needs: manifeste
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: The PR's base (bench; full history for the corpus)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - name: The PR's head (full history, for ab.py's git worktrees)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Tools (gcc, valgrind)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends build-essential valgrind
      - name: Interleaved A/B bench, 10 repetitions, with instructions
        run: |
          depart="$(git -C pr merge-base "$BASE_SHA" "$TETE_SHA")"
          echo "A = the PR's start point $depart (base $BASE_SHA), B = head $TETE_SHA"
          mkdir -p conserver
          base/bee/ci/etape.sh "$ETATS" banc_ab \
            python3 base/bee/bench/ab.py --depot pr --base "$depart" --candidate "$TETE_SHA" \
              --repetitions 10 --instructions --json "$GITHUB_WORKSPACE/conserver/ab.json"
      - name: Keep the state
        if: always()
        run: |
          mkdir -p conserver
          cp -r "$ETATS" conserver/etats 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: etat-banc
          path: conserver/
          if-no-files-found: warn

  # Tests of the PR's CI tooling when it modifies bee/ci/, bee/sandbox/ or this workflow, on minizBee's model: the PR's
  # code, so a separate job, run in the base's sandbox (no network, processes or environment variables), read only, no
  # secret or kept credentials, no artifact or output; only its result counts (the verdict's needs).
  outillage-pr:
    name: Tests of the PR's CI tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: The PR's base (sandbox)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: The PR's head (full history, for the diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - name: Tests of the PR's CI tooling, in the base's sandbox (only if the PR modifies bee/ci/, bee/sandbox/ or this workflow)
        run: |
          if git -C pr diff --quiet "$BASE_SHA...$TETE_SHA" -- bee/ci bee/sandbox .github/workflows/bee-ci.yml; then
            echo "bee/ci/, bee/sandbox/ and bee-ci.yml unchanged by the PR: no tests of the PR's tooling."
            exit 0
          fi
          # Before any of the PR's code: Docker stopped (no daemon reachable from the sandbox), PyYAML for /usr/bin/python3,
          # which the sandbox runs (env -i, the system's PATH), and user namespaces allowed (sans-docker.sh requires them).
          sudo systemctl stop docker.socket docker
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends python3-yaml
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          cd pr && ../base/bee/sandbox/sans-docker.sh /usr/bin/python3 bee/ci/test_verdict.py

  verdict:
    name: Verdict
    needs: [manifeste, compilation-et-tests, fuzzing, banc-ab, outillage-pr]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The PR's base (verdict.py)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - name: The PR's history (read by git diff only, to count the lines)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TETE_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Judges (bee/ of the base, or of the PR at bootstrap)
        id: juges
        run: |
          export base=base pr=pr base_sha="${BASE_SHA:?}" etats="${ETATS:?}"
          eval "$BEE_JUGES"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyYAML (reading the manifest and the task)
        run: pip install "pyyaml==6.0.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: etat-*
          path: artefacts
      - name: Assemble verdict.json
        env:
          RESULTATS_JOBS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTATS_JOBS" > resultats-jobs.json
          python3 base/bee/ci/verdict.py --artefacts artefacts --etats "$ETATS" --jobs resultats-jobs.json \
            --depot pr --base "$BASE_SHA" --tete "$TETE_SHA" --sortie verdict.json
          cat verdict.json
      - name: Fallback verdict (base without judges, verdict.py unavailable)
        if: failure() && steps.juges.outcome == 'failure'
        run: |
          printf '%s\n' '{"ci": "red", "failed_step": "Judges (base without bee/)", "gain": null, "metric": null, "beyond_noise": false, "measurements": {"A": {}, "B": {}}, "instructions": null, "degradations": {}, "changed_lines": null, "bootstrap": false}' > verdict.json
          cat verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: warn
