# Fusionne sans humain les PR en libre-service de ce registre réparti (réservation, libération,
# soumission, relecture, vote, mesure, inscription), une fois la validation passée.
#
# Sécurité : jeton en écriture, donc on n'exécute JAMAIS le code de la PR. On utilise l'outil bee
# du dépôt central (de confiance) et on lit les fichiers de la PR comme des données, sur une fusion
# simulée avec master (pour voir l'état réel du registre après fusion). Fusion dans le même dépôt :
# le jeton par défaut suffit, aucun secret d'organisation.
name: Fusion automatique (shard)

on:
  workflow_run:
    workflows: ["Validation du registre (shard)"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ecriture-master
  cancel-in-progress: false

jobs:
  fusionner:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Dépôt du projet (branche principale)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Outil de confiance (dépôt central)
        uses: actions/checkout@v4
        with:
          repository: Bee-ruche/registre
          ref: main
          path: .bee-central
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r .bee-central/outils/requirements.txt
      - name: Retrouver la pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr list --state open --limit 200 --json number,headRefOid,author \
            --jq ".[] | select(.headRefOid == \"$SHA\") | \"numero=\(.number)\nauteur=\(.author.login)\"" >> "$GITHUB_OUTPUT"
      - name: Vérifier la fusion simulée avec l'outil de confiance
        id: verif
        if: steps.pr.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.pr.outputs.numero }}
          AUTEUR: ${{ steps.pr.outputs.auteur }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin "pull/$NUMERO/head:pr-$NUMERO"
          test "$(git rev-parse "pr-$NUMERO")" = "$SHA"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach ../fusion origin/master
          if ! git -C ../fusion merge --no-edit --no-ff "pr-$NUMERO"; then
            echo "Conflit avec master : la PR doit se rebaser."
            echo "code=3" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cree=$(gh api "users/$AUTEUR" --jq '.created_at[:10]')
          set +e
          python3 .bee-central/outils/bee.py --registre ../fusion/registre verifier-pr \
            --base origin/master --tete HEAD --auteur "$AUTEUR" --compte-cree-le "$cree" --fusion-auto
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]
      - name: Fusionner
        if: steps.verif.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.pr.outputs.numero }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$NUMERO" --squash --match-head-commit "$SHA"
