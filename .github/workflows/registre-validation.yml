# Valide le registre réparti de ce projet (sous-dossier registre/) à chaque PR et poussée qui le touche.
#
# L'outil bee vient du dépôt central (Bee-ruche/registre), jamais de la PR : une PR ne peut pas
# assouplir l'outil ni les schémas qui la jugent. Lecture seule, aucun secret.
name: Validation du registre (shard)

on:
  pull_request:
    paths: ["registre/**"]
  push:
    branches: [master]
    paths: ["registre/**"]

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Outil de confiance (dépôt central)
        uses: actions/checkout@v4
        with:
          repository: Bee-ruche/registre
          ref: main
          path: .bee-central
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r .bee-central/outils/requirements.txt
      - name: Validation complète du registre
        run: python3 .bee-central/outils/bee.py --registre registre valider
