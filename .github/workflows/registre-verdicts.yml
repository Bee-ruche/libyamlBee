# Récupère les verdicts de la CI (bee-ci) des PR de contribution de ce projet et les reporte dans
# le registre réparti (sous-dossier registre/).
#
# Sécurité : seul l'outil bee du dépôt central (de confiance) s'exécute ; verdict.json et
# CONTRIBUTION.yaml viennent des PR et sont traités comme des données.
name: Verdicts (shard)

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ecriture-master
  cancel-in-progress: false

jobs:
  verdicts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Outil de confiance (dépôt central)
        uses: actions/checkout@v4
        with:
          repository: Bee-ruche/registre
          ref: main
          path: .bee-central
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r .bee-central/outils/requirements.txt
      - name: Récupérer les verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .bee-central/outils/bee.py --registre registre en-attente \
            | python3 -c 'import json, sys; [print(c["id"], c["pr"], c.get("sha_verdict") or "-", sep="\t") for c in json.load(sys.stdin) if c.get("pr")]' \
            > a_traiter.tsv
          while IFS=$'\t' read -r id pr sha_connu; do
            depot=$(printf '%s' "$pr" | sed -E 's#^https://github\.com/([A-Za-z0-9-]+/[A-Za-z0-9_.-]+)/pull/[0-9]+$#\1#')
            sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid) || continue
            [ "$sha" = "$sha_connu" ] && continue
            execution=$(gh run list -R "$depot" --commit "$sha" --workflow bee-ci.yml --status completed --limit 1 \
              --json databaseId,url --jq '.[0] | "\(.databaseId) \(.url)"')
            [ -z "$execution" ] && continue
            numero=${execution%% *}; adresse=${execution#* }
            rm -rf "$RUNNER_TEMP/verdict" && mkdir -p "$RUNNER_TEMP/verdict"
            gh run download "$numero" -R "$depot" -n verdict -D "$RUNNER_TEMP/verdict" || continue
            options=()
            if gh api "repos/$depot/contents/CONTRIBUTION.yaml?ref=$sha" --jq .content | base64 -d > "$RUNNER_TEMP/verdict/CONTRIBUTION.yaml" 2>/dev/null \
               && [ -s "$RUNNER_TEMP/verdict/CONTRIBUTION.yaml" ]; then
              options+=(--manifeste "$RUNNER_TEMP/verdict/CONTRIBUTION.yaml")
            fi
            python3 .bee-central/outils/bee.py --registre registre enregistrer-verdict "$id" \
              --verdict "$RUNNER_TEMP/verdict/verdict.json" --sha "$sha" --execution "$adresse" "${options[@]}" || true
          done < a_traiter.tsv
          rm -f a_traiter.tsv
      - name: Publier
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            python3 .bee-central/outils/bee.py --registre registre valider
            git commit -am "Verdicts de la CI"
            git push origin HEAD:master
          fi
