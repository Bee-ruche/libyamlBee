  - "lancer.sh --regenerer-empreintes sur la base (empreintes-reference.txt inchangé à l'octet) et --sans-empreintes (OK)"
  - "bee/ci/tests.sh rejoué sur deux clones (juges de la base 1e90ffd, PR 91fa157) : OK, 19,7 s"
  - "bee/ci/tests_origine.sh (cmake + ctest) : 3/3 tests d'origine passés"
  - "aller_retour compilé avec ASan + UBSan (gcc, -O1, détection de fuites) sur le corpus, les cas intégrés et 33 entrées écrites à la main (dont examples/*.yaml et regression-inputs/) : aucune erreur, aucune fuite ; empreintes du corpus identiques à la référence. lancer.sh n'a pas d'option --sanitiseurs : compilation manuelle via OPT_TESTS"
