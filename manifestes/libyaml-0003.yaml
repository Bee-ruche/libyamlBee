  - "API document (yaml_parser_load puis yaml_emitter_dump, dumper.c) : seule l'API événements est couverte ; une optimisation de dumper.c seul ne serait pas jugée par ce test, alors que le banc debit_emission passe par yaml_emitter_dump. Piste pour une tâche suivante (taille M : il faut normaliser les noms d'ancres et les étiquettes par défaut)"
  - "Réglages non par défaut de l'émetteur (canonique, unicode, largeur, indentation, sauts CR/CRLF)"
  - "La CI GitHub elle-même : l'étape tests.sh n'a été rejouée qu'en local ; le nouveau juge n'est pas dans la base, donc seule la seconde passe de tests.sh (outillage de la PR) l'exécute"
  - "Pas de fuzzing de l'aller-retour (hors tâche)"
doutes: >
  N3 accepte aussi la disparition d'une étiquette « ! » sur un scalaire écrit plain : c'est le
  comportement actuel de libyaml (selon la spécification, « ! x » est une chaîne et « x » se résout
  comme plain), toléré ici parce que les deux indicateurs implicites restent égaux ; un changement de
  ce côté ne serait vu que par l'empreinte. Plus largement, N2 et N3 laissent passer un émetteur qui
  met plus de scalaires entre guillemets qu'avant : seule l'empreinte l'attrape, donc en mode
  --sans-empreintes un tel changement passe. La couverture des normalisations repose sur 22 petits
  cas intégrés, pas sur le corpus (generer.py est hors du périmètre) : une tâche de corpus pourrait
  les y déplacer. Marge de durée : 19,7 s pour l'étape CI complète ici, sur une machine partagée à
  2 cœurs ; à confirmer sur les machines de la CI.
taille_reelle: S
