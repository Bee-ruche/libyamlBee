  - "Failing the job without calling the tool or writing the task copy: an unreadable task, type or metric, an optimisation without a metric, an unreadable, mixed, missing or duplicated descriptor, a task missing or found twice. The metric list taken from the registry's descriptor. The command and options asked from --help: a renamed-command stub without options set aside; two complete commands, an option under both names, a missing option or a failing help refused."
  - "verdict.py: the metric from the task copy in both vocabularies, red when the copy is absent in CI or unreadable, never the manifest's metric, a task copy or manifest in another job's artifact ignored; the R1 count. bee-ci.yml: the requirements and manifest-keeping steps extracted and run."
