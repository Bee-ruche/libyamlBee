resume: "libyamlBee's CI reads the registry in both vocabularies (French, English) before the switch: tasks, project descriptor, manifests, tool, command, options; unreadable means red, never a default."
changement: >
  The « Manifeste et taille » job reads registry main, unpinned; it now reads both layouts of docs/english-names.md
  (section 6) and maps everything to libyamlBee's internal French names, with the design of miniz-0049 (minizBee PR
  24). bee/ci/vocabulaire.py (new): task keys and values (metric or metrique, compressed_output or sortie_compressee,
  type optimization/review/measurement/test/split or their French values), project descriptor keys (metrics or
  metriques, each metric's unit/direction or unite/sens) and manifest keys at all three levels (task/tache,
  agent.model/modele, measurements.before/mesures.avant…), one vocabulary per document, a mixed document refused
  (Illisible); a missing or unknown type or metric, an optimisation task without a metric, or a descriptor without a
  readable, non-empty metric list is an error, never a default. bee/ci/tache.py: projects/ or projets/libyaml.yaml and
  tasks/ or taches/libyaml/<task>.yaml, exactly one of each (found twice: refused); the task's metric must be one of
  the registry descriptor's metrics, as before; the manifest in either vocabulary. bee/ci/verifier_fork.py (new,
  identical to minizBee's): tools/bee.py or outils/bee.py (exactly one); the global option (--registry/--registre),
  the command (check-fork/verifier-fork) and its options (--task/--tache, --head/--tete, --repo/--depot,
  --author/--auteur) are read from the usage line of each --help, never guessed; a command is kept only if its usage
  announces every option needed, and exactly one must be; BEE_REGISTRE and BEE_REGISTRY are removed, then the one of
  the announced vocabulary names the registry. bee/ci/manifeste.sh: manifests/ or manifestes/ (diff filter and name
  check). bee-ci.yml: whichever requirements file exists (exactly one), the manifest kept from either folder.
  bee/ci/verdict.py: the main metric from the task copy in either vocabulary, read from the manifeste job's artifact
  (etat-manifeste) only, as minizBee does; a copy absent in CI, unreadable, mixed, without a metric key or with an
  unknown metric turns « Manifeste et taille » red, and the PR's manifest never chooses the metric (it is read only in
  a local simulation without a task copy); manifests/** beside manifestes/** in the R1 exclusions. bee/ci/juges.sh:
  one comment line. Size: 380 lines outside the tests (verifier_fork.py, 94, is minizBee's file unchanged), 19 of
  them counted by R1 (bee-ci.yml; bee/** is excluded).
