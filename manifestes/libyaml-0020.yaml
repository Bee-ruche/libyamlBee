  - "ARM64: x86-64 only here (nothing in this change is architecture-dependent)."
doutes: >
  Before the switch, a contribution must keep its manifest in manifestes/ with French keys: today's French tool
  (verifier-fork) reads only that folder and those keys, so a manifest in manifests/ or with English keys, accepted by
  the fork, would still be refused by the registry until the switch. The help reading follows argparse's usage format:
  if the registry ever keeps the old command as a full subcommand with all its options, both commands are retained and
  the job turns red (fail closed), to be fixed then. Behaviour changes on libyamlBee: a task with metrique: null no
  longer takes the manifest's metric; an unknown type or a metric outside the descriptor now fails instead of passing as
  « inconnu » or « aucune » (relecture added to the closed list); a descriptor without a metric list fails instead of
  yielding an empty list; a task or descriptor found twice is refused; an optimisation task without a metric is
  refused. The fork's CI judges a PR with the base's bee/, so this PR's own run still uses the old scripts, and the new
  ones apply from the next PR on. No libyamlBee PR is open, so none needs a rebase.
taille_reelle: M
