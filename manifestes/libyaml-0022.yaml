  - "New tests: the job reads only, keeps no credentials, has no output, uploads no artifact, uses no secret, writes neither GITHUB_OUTPUT nor GITHUB_ENV, stops Docker before the sandbox, runs the PR's code only through the base's sandbox, and is in the verdict's needs (which list every other job); the step on small git repositories: bee/ci/ changed, a new file in bee/ci/, the sandbox script or the workflow changed, the tests run in the sandbox from pr/ after the sudo preparations (Docker stop included) and their failure fails the step; only src/ changed, nothing runs; the verdict red for failure, cancelled or skipped even with a planted « succes » state file, green for success."
