resume: "libyamlBee's CI runs the tests of its own CI scripts (bee/ci/test_verdict.py) for a PR that changes bee/ci/, bee/sandbox/ or the workflow, in the base's sandbox, in a job whose result the verdict counts."
changement: >
  bee-ci.yml gets a job « Tests de l'outillage de CI de la PR » (outillage-pr), on minizBee's model: when the PR
  changes bee/ci/, bee/sandbox/ or bee-ci.yml (git diff base...head), it runs the PR's bee/ci/test_verdict.py in the sandbox of the
  base (base/bee/sandbox/sans-docker.sh) with the system's /usr/bin/python3. Before any code of the PR runs, the step
  stops Docker (docker.socket, docker), installs python3-yaml and allows user namespaces, which the sandbox requires
  (sysctl kernel.apparmor_restrict_unprivileged_userns=0, when the key exists). Since the PR's code runs in it, the job
  produces only a result: contents read only, checkouts without kept credentials, no artifact, no output, no secret;
  the Juges step comes first, as in every job that uses the base's bee/. The verdict counts it: outillage-pr is in the
  verdict job's needs, and bee/ci/verdict.py turns « ci » red for any job that did not succeed (failure, cancelled or
  skipped), named « job outillage-pr ». The header comment lists the new step. After the independent adversarial
  review: bee/sandbox/sans-docker.sh runs the command in its own PID namespace with its own /proc (unshare --pid --fork
  --mount-proc, --kill-child) and with an empty /tmp of its own, the repository being mounted in the empty home at a new
  path each time; bee/ci/verdict.py reads each state file <step>.txt only in the state folder of the job that writes
  it, as bee-ci.yml uploads it (DOSSIERS_ETATS: etat-manifeste/etats, etat-tests-<arch>, etat-fuzzing,
  etat-banc/etats; « juges » and « amorcage » in each of them), and at the root of --etats, never in another artifact
  or a subfolder, and reads a file found in the artifacts only if it is a regular file, never through a symbolic link
  (same hardening as minizBee's miniz-0051). bee/README.md describes the sandbox accordingly. Tests in
  bee/ci/test_verdict.py; the task's files list only bee-ci.yml, and bee/** is excluded from R1. Size: 45 lines counted
  by R1 (bee-ci.yml, +43 -2); outside the tests, bee/sandbox/sans-docker.sh +14 -8, bee/ci/verdict.py +41 -18,
  bee/README.md +4 -3; bee/ci/test_verdict.py +156 -7 (the tests' state files now written where their jobs put them).
