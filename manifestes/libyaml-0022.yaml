resume: "libyamlBee's CI runs the tests of its own CI scripts (bee/ci/test_verdict.py) for a PR that changes bee/ci/ or the workflow, in the base's sandbox, in a job whose result the verdict counts."
changement: >
  bee-ci.yml gets a job « Tests de l'outillage de CI de la PR » (outillage-pr), on minizBee's model: when the PR
  changes bee/ci/ or bee-ci.yml (git diff base...head), it runs the PR's bee/ci/test_verdict.py in the sandbox of the
  base (base/bee/sandbox/sans-docker.sh: no network, no environment variables, an empty home), with the system's
  /usr/bin/python3; before any code of the PR runs, the step installs python3-yaml and allows user namespaces, which
  the sandbox requires (sysctl kernel.apparmor_restrict_unprivileged_userns=0, when the key exists). Since the PR's
  code runs in it, the job produces only a result: contents read only, checkouts without kept credentials, no
  artifact, no output, no secret; the Juges step comes first, as in every job that uses the base's bee/. The verdict
  counts it: outillage-pr is in the verdict job's needs, and bee/ci/verdict.py (unchanged) turns « ci » red for any
  job that did not succeed (failure, cancelled or skipped), named « job outillage-pr ». The header comment lists the
  new step. Tests, in bee/ci/test_verdict.py (outside the task's files, which list only bee-ci.yml; bee/** is excluded
  from R1): the job's structure, the step extracted from the workflow and run with witnesses for sudo and the sandbox,
  and the verdict counting its result; JOBS_OK now mirrors the verdict's needs. Size: 44 lines counted by R1
  (bee-ci.yml, +42 -2); bee/ci/test_verdict.py +87 -3.
