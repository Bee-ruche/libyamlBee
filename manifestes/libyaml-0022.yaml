doutes: >
  The fork's CI judges a PR with the base's bee/: this PR's own run of the new job uses master's sans-docker.sh (no
  PID namespace, shared /tmp) with Docker stopped, and master's verdict.py; the new sandbox and the state-folder rule
  apply from the next PR on. The job runs only when the PR changes bee/ci/, bee/sandbox/ or bee-ci.yml, like
  minizBee's (bee/ci/ and its workflow); unlike minizBee, libyamlBee's manifest job does not also run the base's tests on every PR (the tests only read bee/ci/, the
  sandbox script and the workflow). The verdict names a failure « job outillage-pr » rather than a step label. The
  state folders are those bee-ci.yml uploads today: a job that changes where it puts its states must change
  DOSSIERS_ETATS with it, or its step stays without a result and the verdict red. Such PRs take about half a minute
  more (apt-get update and python3-yaml). A local simulation must put its state files at the root of --etats or in the
  jobs' state folders.
