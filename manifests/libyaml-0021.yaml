  - "In a temporary copy of registry main: bee record-verdict records the English and the French verdict of the same inputs identically, records the English red verdict and the workflow's English fallback verdict, and refuses an English verdict with another metric; bee record-measurement records the French report and its English translation identically, and accepts the real new report."
