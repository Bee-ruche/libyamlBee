summary: "libyamlBee writes English: verdict.json, metric ids, ab.py's report and bee-ci.yml's texts; the registry is read in English only, its metric ids in both vocabularies until ruche-0149."
change: >
  As re-scoped by the council on 11 Nov (no common judge or plugin in libyamlBee yet). (1) bee/ci/verdict.py
  writes verdict.json in English by names.yaml's fork_verdict family: ci green/red, failed_step with English step
  labels, metric, beyond_noise, measurements, changed_lines, bootstrap, steps (passed/failed/absent) and details.
  (2) Metric ids in English where the fork emits them: banc.c's JSON line, ab.py's report, the verdict's metric,
  instructions and degradations (parse_throughput, load_throughput, emit_throughput, max_memory_kb,
  instructions_parse/_load/_emit). bee/ci/vocabulaire.py reads the registry's task and project files with French or
  English ids (METRIQUES_FR), one vocabulary per document, until ruche-0149 renames the registry's data.
  (3) ab.py's report keys in English (names.yaml ab_report and judge_report; direction and unit values too); its
  docstring, description and --depot help now describe libyaml, not miniz. (4) bee-ci.yml: job and step names,
  comments, notices and the fallback verdict in English; BEE_JUGES and bee/ci/juges.sh translated together, and
  test_verdict.py now checks that the two copies are identical and behave the same (that test did not exist in
  libyamlBee). (5) Registry main has no taches/, projets/, outils/, French keys or values, verifier-fork or
  --registre any more: tache.py, vocabulaire.py, verifier_fork.py and the dependencies step read the English names
  only. The PR's manifest is still read in either vocabulary (bee reads both until its DATE_D), and manifestes/ and
  CONTRIBUTION.yaml are still found. (6) libyaml-0019's follow-ups: generer.py's messages in English; bee/README.md
  and AGENTS.md describe the round trip and the fuzzing that exist (libyaml-0003, libyaml-0002) and their real limits.
  AGENTS.md is outside this task's files (.github/workflows/, bee/): one table row, the review follow-up of
  libyaml-0019 that was handed to this task, kept here rather than in a PR of its own.
