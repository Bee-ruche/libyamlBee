id: libyaml
nom: libyaml
categorie: parsing-serialisation
depot_origine: https://github.com/yaml/libyaml
licence: MIT
fork: https://github.com/Bee-ruche/libyamlBee
reference: yaml-test-suite (flux d'événements attendus, via tests/run-parser-test-suite.c) et libfyaml ; même flux d'événements, mêmes erreurs
perimetre:
  - Analyseur (scanner, parser)
  - Chargeur de documents
  - Émetteur
hors_perimetre:
  - API publique (yaml.h)
statut: actif
phase_ouverture: 1
palier_mainteneur: aucun
metriques:
  - id: debit_analyse
    description: Débit du parseur seul (événements) sur le corpus de référence
    unite: Mo/s
    sens: plus_haut
  - id: debit_chargement
    description: Débit du chargeur de documents sur le corpus de référence
    unite: Mo/s
    sens: plus_haut
  - id: debit_emission
    description: Débit de l'émetteur sur le corpus de référence
    unite: Mo/s
    sens: plus_haut
  - id: memoire_max_ko
    description: Pic de tas pendant le chargement
    unite: Ko
    sens: plus_bas
chemins_hors_decompte:
  - "bee/**"
  - "tests/**"
# Chemins qui jugent les contributions : une tâche d'optimisation ne peut pas les modifier (commandement 3).
# Tout bee/ en fait partie : corpus, tests, fuzzing, banc, scripts de CI, code commun, Makefile.
chemins_juges:
  - "bee/**"
  - "tests/**"
  - ".github/**"
# Oracle : pour chaque fichier du corpus, tests/run-parser-test-suite émet le flux d'événements
# canonique (format yaml-test-suite). Une optimisation doit produire un flux STRICTEMENT identique
# et le même statut d'erreur (empreintes SHA-256, comme miniz). L'émetteur est vérifié par
# aller-retour (événements → YAML → événements). Le fuzzing différentiel compare base et candidat
# sur une entrée arbitraire : même flux, même erreur, plus ASan/UBSan.
commandes:
  corpus: python3 bee/corpus/generer.py
  tests: bee/tests/lancer.sh
  banc_ab: python3 bee/bench/ab.py --base upstream/master --candidate HEAD
  fuzz: bee/fuzz/lancer.sh 600
depot_registre: https://github.com/Bee-ruche/libyamlBee
