id: libyaml-0001
projet: libyaml
categorie: parsing-serialisation
type: test
taille: L
titre: "Oracle différentiel contre un parseur de référence indépendant"
contexte: >
  L'oracle actuel (bee/tests/oracle.c) vérifie le DÉTERMINISME : le flux d'événements d'une
  contribution est identique à celui de la base. Il ne vérifie pas que libyaml a raison dans
  l'absolu. Un oracle plus fort compare le flux d'événements de libyaml à celui d'un parseur YAML
  INDÉPENDANT (par exemple PyYAML via sa liaison C, ou libfyaml), sur un corpus d'entrées valides :
  là où ils divergent sur une entrée bien formée, c'est un défaut à signaler (procédure sécurité du
  registre si c'est exploitable). Écrire bee/tests/differentiel_ref.* et l'intégrer à
  bee/tests/lancer.sh, en tolérant les écarts de forme documentés (styles de scalaires, tags
  implicites) et en ne comparant que la structure (clé/valeur/séquence) et les erreurs. Respecter
  docs/outillage.md : jamais en libre-service, correction actuelle préservée, méta-tests.
fichiers: [bee/tests/lancer.sh]
portee: 1.0
metrique: null
critere_acceptation:
  - "CI verte (R2) sur la base et sur cette contribution, x86-64 et ARM64"
  - "le parseur de référence est justifié dans le manifeste (licence compatible, provenance figée)"
  - "au moins une divergence connue est détectée sur un cas construit exprès (démo dans le manifeste)"
  - "les écarts de forme tolérés sont listés et justifiés ; aucune entrée du corpus ne régresse"
hors_perimetre: [sources de libyaml, nouvelle dépendance non justifiée]
statut: ouverte
cree_par: conseil
cree_le: "2026-10-27"
