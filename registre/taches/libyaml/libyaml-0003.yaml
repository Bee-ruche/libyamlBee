id: libyaml-0003
projet: libyaml
categorie: parsing-serialisation
type: test
taille: S
titre: "Oracle d'aller-retour de l'émetteur (événements → YAML → événements)"
contexte: >
  L'oracle actuel couvre l'analyse. Pour juger les optimisations de l'émetteur (dumper.c,
  emitter.c), ajouter un contrôle d'aller-retour : charger chaque document du corpus, le ré-émettre
  en YAML, le ré-analyser, et exiger un flux d'événements identique (aux normalisations de forme
  documentées près). Écrire bee/tests/aller_retour.c et l'intégrer à bee/tests/lancer.sh, avec ses
  propres empreintes de référence. Garder la durée totale des tests raisonnable (< 30 s en CI).
fichiers: [bee/tests/lancer.sh]
portee: 0.7
metrique: null
critere_acceptation:
  - "CI verte (R2), x86-64 et ARM64"
  - "l'aller-retour est stable sur tout le corpus ; les normalisations tolérées sont listées"
  - "une mutation de l'émetteur qui change la structure ré-analysée fait échouer le test"
hors_perimetre: [sources de libyaml]
statut: ouverte
cree_par: conseil
cree_le: "2026-10-27"
