id: libyaml-0010
projet: libyaml
categorie: parsing-serialisation
type: optimisation
taille: M
titre: "yaml_parser_update_buffer : chemin rapide ASCII dans le décodage UTF-8"
contexte: >
  Profil callgrind de la base (banc analyse, 128 premiers Kio par fichier) : yaml_parser_update_buffer
  (src/reader.c) coûte 16,6 % des instructions de l'analyse. Elle remplit le tampon et décode
  l'UTF-8 octet par octet, avec un contrôle de validité par caractère, même quand l'entrée est de
  l'ASCII pur (le cas courant : clés, indentation, scalaires simples). Piste : détecter les plages
  d'octets < 0x80 et les copier/valider en bloc, en retombant sur le chemin général dès le premier
  octet >= 0x80. Le résultat doit être STRICTEMENT identique : même flux d'événements, mêmes refus
  sur entrée invalide (UTF-8 mal formé toujours rejeté au même endroit). bee/tests/lancer.sh et le
  fuzzing le vérifient. Garder le chemin général comme repli (R6, portabilité).
fichiers: [src/reader.c]
portee: 1.0
metrique: debit_analyse
critere_acceptation:
  - "CI verte (R2), x86-64 et ARM64 ; flux d'événements inchangé (empreintes identiques)"
  - "gain >= 2 % sur debit_analyse, au-delà du bruit (R4)"
  - "aucune autre métrique dégradée de plus de 1 % (R5)"
  - "les entrées UTF-8 invalides sont toujours rejetées, au même endroit (cas de test dans le manifeste)"
hors_perimetre: [format de sortie, API publique (yaml.h), nouvelle dépendance, validation UTF-8 (mêmes refus)]
statut: ouverte
cree_par: conseil
cree_le: "2026-10-27"
